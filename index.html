<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حنان 🌸 برنامجي الأسبوعي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ec4899;--pink2:#f9a8d4;--pink3:#fce7f3;
  --violet:#7c3aed;--violet2:#c4b5fd;
  --peach:#fb923c;--peach2:#fed7aa;
  --sage:#10b981;--sage2:#6ee7b7;
  --ink:#130811;--ink2:#1e0d1a;--ink3:#2a1224;
  --text:#fdf2f8;--sub:#f9a8d4;--muted:#9d6f8a;
  --glass:rgba(236,72,153,0.07);--border:rgba(236,72,153,0.2);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--ink);background-image:radial-gradient(ellipse at 20% 5%,#7c3aed18 0%,transparent 55%),radial-gradient(ellipse at 80% 90%,#ec489918 0%,transparent 55%);color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif;min-height:100vh;direction:rtl;}
#app{max-width:480px;margin:0 auto;min-height:100vh;}
#content{padding:14px 13px 92px;}
#bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(19,8,17,0.97);backdrop-filter:blur(16px);border-top:1px solid rgba(236,72,153,0.2);display:flex;z-index:50;}
.nav-btn{flex:1;padding:10px 4px 8px;background:none;border:none;cursor:pointer;color:var(--muted);font-size:10px;font-weight:600;font-family:'IBM Plex Sans Arabic',sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all 0.2s;border-top:2px solid transparent;}
.nav-btn.active{color:var(--pink);border-top-color:var(--pink);}
.nav-btn .ni{font-size:19px;}
.card{background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:18px;padding:15px;margin-bottom:11px;}
.card-pink{border-color:rgba(236,72,153,0.38);background:rgba(236,72,153,0.08);}
.card-violet{border-color:rgba(124,58,237,0.32);background:rgba(124,58,237,0.07);}
.card-peach{border-color:rgba(251,146,60,0.32);background:rgba(251,146,60,0.07);}
.card-sage{border-color:rgba(16,185,129,0.3);background:rgba(16,185,129,0.06);}
.card-done{border-color:rgba(34,197,94,0.35);background:rgba(34,197,94,0.06);}
.hero{background:linear-gradient(135deg,#7c3aed22,#ec489922,#fb923c18);border:1px solid rgba(236,72,153,0.28);border-radius:22px;padding:18px 16px;margin-bottom:13px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-20px;left:-20px;width:90px;height:90px;background:radial-gradient(circle,#ec489922,transparent);border-radius:50%;}
.hero-name{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:#fff;}
.stat-pill{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.11);border-radius:30px;padding:3px 10px;font-size:11px;font-weight:600;color:var(--sub);margin:2px 2px 0 0;}
.section-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:var(--text);margin-bottom:11px;display:flex;align-items:center;gap:7px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;}
.btn-pink{width:100%;padding:13px;border-radius:13px;border:none;background:linear-gradient(135deg,#be185d,#ec4899);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'IBM Plex Sans Arabic',sans-serif;box-shadow:0 5px 18px rgba(236,72,153,0.3);margin-bottom:9px;transition:transform 0.15s;}
.btn-pink:active{transform:scale(0.98);}
.btn-ghost{width:100%;padding:11px;border-radius:13px;border:1.5px solid rgba(236,72,153,0.3);background:transparent;color:var(--pink2);font-size:13px;font-weight:600;cursor:pointer;font-family:'IBM Plex Sans Arabic',sans-serif;margin-bottom:9px;}
/* MEAL CHOICE SELECTOR */
.choice-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.choice-btn{padding:6px 12px;border-radius:18px;border:1.5px solid rgba(236,72,153,0.22);background:transparent;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;font-family:'IBM Plex Sans Arabic',sans-serif;transition:all 0.2s;}
.choice-btn.chosen{background:rgba(236,72,153,0.18);border-color:var(--pink);color:var(--pink2);}
.meal-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:18px;margin-bottom:6px;}
.meal-tag.breakfast{background:rgba(251,146,60,0.15);color:var(--peach);border:1px solid rgba(251,146,60,0.28);}
.meal-tag.snack{background:rgba(124,58,237,0.13);color:var(--violet2);border:1px solid rgba(124,58,237,0.22);}
.meal-tag.lunch{background:rgba(236,72,153,0.14);color:var(--pink2);border:1px solid rgba(236,72,153,0.25);}
.meal-tag.dinner{background:rgba(16,185,129,0.13);color:var(--sage2);border:1px solid rgba(16,185,129,0.22);}
.meal-tag.sweet{background:rgba(251,146,60,0.13);color:var(--peach2);border:1px solid rgba(251,146,60,0.22);}
.meal-item{display:flex;align-items:flex-start;gap:7px;font-size:13px;color:var(--sub);line-height:1.5;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.meal-dot{width:5px;height:5px;background:var(--pink);border-radius:50%;flex-shrink:0;margin-top:7px;}
.done-meal-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:8px;border-radius:11px;border:1.5px solid;font-size:12px;font-weight:700;cursor:pointer;font-family:'IBM Plex Sans Arabic',sans-serif;margin-top:7px;transition:all 0.2s;}
.done-meal-btn.off{border-color:rgba(255,255,255,0.09);background:transparent;color:var(--muted);}
.done-meal-btn.on{border-color:#22c55e;background:rgba(34,197,94,0.1);color:#86efac;}
.day-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;margin-bottom:13px;scrollbar-width:none;}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{flex:0 0 auto;padding:7px 13px;border-radius:18px;border:1.5px solid rgba(255,255,255,0.09);background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:'IBM Plex Sans Arabic',sans-serif;transition:all 0.2s;white-space:nowrap;}
.day-tab.active{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 3px 12px rgba(236,72,153,0.35);}
.ch-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:13px;margin-bottom:7px;border:1px solid rgba(255,255,255,0.07);background:var(--glass);cursor:pointer;transition:all 0.2s;}
.ch-item.done-ch{background:rgba(34,197,94,0.06);border-color:rgba(34,197,94,0.22);}
.ch-circle{width:25px;height:25px;border-radius:50%;flex-shrink:0;border:2px solid rgba(255,255,255,0.13);display:flex;align-items:center;justify-content:center;font-size:12px;transition:all 0.2s;}
.ch-circle.done{background:#22c55e;border-color:#22c55e;}
.ex-card{background:var(--glass);border:1px solid rgba(124,58,237,0.22);border-radius:15px;padding:13px;margin-bottom:9px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:all 0.2s;}
.ex-card.done-ex{background:rgba(34,197,94,0.07);border-color:rgba(34,197,94,0.28);}
.ex-icon-box{width:42px;height:42px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;}
.mot-card{background:linear-gradient(135deg,rgba(236,72,153,0.13),rgba(124,58,237,0.13));border:1px solid rgba(236,72,153,0.22);border-radius:18px;padding:18px;text-align:center;margin-bottom:11px;}
.macro-bar-wrap{width:100%;height:7px;background:rgba(255,255,255,0.07);border-radius:10px;overflow:hidden;margin-bottom:2px;}
.macro-bar{height:100%;border-radius:10px;transition:width 0.8s;}
.water-cup{width:35px;height:46px;border-radius:6px;border:1px solid rgba(236,72,153,0.15);cursor:pointer;font-size:17px;transition:all 0.2s;background:rgba(236,72,153,0.07);}
.water-cup.filled{background:linear-gradient(180deg,#f9a8d4,#ec4899);transform:scale(1.06);box-shadow:0 0 9px rgba(236,72,153,0.35);}
.steps-ring{position:relative;display:flex;align-items:center;justify-content:center;}
.steps-ring svg{transform:rotate(-90deg);}
.steps-center{position:absolute;text-align:center;}
.steps-num{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--pink);line-height:1;}
.tip-card{background:rgba(251,146,60,0.07);border:1px solid rgba(251,146,60,0.22);border-radius:13px;padding:11px 13px;font-size:12px;color:var(--sub);line-height:1.65;margin-bottom:8px;}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,0.82);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal-box{background:#130811;border:1px solid rgba(236,72,153,0.28);border-radius:22px 22px 0 0;padding:22px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;}
.hidden{display:none!important;}
.fade-in{animation:fi 0.28s ease;}
@keyframes fi{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.num-input{width:100%;background:rgba(255,255,255,0.05);border:1.5px solid rgba(236,72,153,0.28);border-radius:11px;padding:11px 13px;color:var(--text);font-size:19px;font-family:'IBM Plex Sans Arabic',sans-serif;text-align:center;outline:none;}
.num-input:focus{border-color:var(--pink);}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#be185d,#ec4899);color:#fff;padding:9px 20px;border-radius:50px;font-weight:700;font-size:12px;z-index:300;box-shadow:0 5px 18px rgba(236,72,153,0.4);opacity:0;transition:opacity 0.28s;pointer-events:none;font-family:'IBM Plex Sans Arabic',sans-serif;white-space:nowrap;}
.toast.show{opacity:1;}
.snack-tag{display:inline-block;background:rgba(236,72,153,0.09);border:1px solid rgba(236,72,153,0.18);border-radius:18px;padding:3px 9px;font-size:11px;color:var(--sub);margin:2px;}
.prog-row{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
.prog-label{font-size:12px;color:var(--sub);width:88px;flex-shrink:0;text-align:right;}
.prog-track{flex:1;height:7px;background:rgba(255,255,255,0.06);border-radius:10px;overflow:hidden;}
.prog-fill{height:100%;border-radius:10px;}
</style>
</head>
<body>
<div id="app">
  <div id="content"></div>
  <nav id="bottom-nav">
    <button class="nav-btn active" data-tab="home" onclick="go('home')"><span class="ni">✨</span>اليوم</button>
    <button class="nav-btn" data-tab="plan" onclick="go('plan')"><span class="ni">🍽</span>خطتي</button>
    <button class="nav-btn" data-tab="exercise" onclick="go('exercise')"><span class="ni">💪</span>رياضة</button>
    <button class="nav-btn" data-tab="macros" onclick="go('macros')"><span class="ni">📊</span>ماكروز</button>
    <button class="nav-btn" data-tab="motiv" onclick="go('motiv')"><span class="ni">🌟</span>تحفيز</button>
  </nav>
</div>

<div id="stepsModal" class="modal-ov hidden">
  <div class="modal-box">
    <div style="font-size:17px;font-weight:800;text-align:center;margin-bottom:14px;">👟 كم خطوة مشيتِ؟</div>
    <input type="number" id="stepsInput" class="num-input" placeholder="مثال: 6500">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px;">
      <button onclick="closeModal('stepsModal')" style="padding:11px;border-radius:11px;border:1px solid rgba(255,255,255,0.09);background:none;color:var(--muted);cursor:pointer;font-family:'IBM Plex Sans Arabic',sans-serif;">إلغاء</button>
      <button onclick="saveSteps()" style="padding:11px;border-radius:11px;border:none;background:var(--pink);color:#fff;font-weight:700;cursor:pointer;font-family:'IBM Plex Sans Arabic',sans-serif;">حفظ 🌸</button>
    </div>
  </div>
</div>

<div id="weightModal" class="modal-ov hidden">
  <div class="modal-box">
    <div style="font-size:17px;font-weight:800;text-align:center;margin-bottom:14px;">⚖️ سجّلي وزنك</div>
    <input type="number" id="weightInput" class="num-input" placeholder="مثال: 57.2" step="0.1">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px;">
      <button onclick="closeModal('weightModal')" style="padding:11px;border-radius:11px;border:1px solid rgba(255,255,255,0.09);background:none;color:var(--muted);cursor:pointer;font-family:'IBM Plex Sans Arabic',sans-serif;">إلغاء</button>
      <button onclick="saveWeight()" style="padding:11px;border-radius:11px;border:none;background:var(--pink);color:#fff;font-weight:700;cursor:pointer;font-family:'IBM Plex Sans Arabic',sans-serif;">حفظ ✓</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
var NAME='حنان', AGE=22, HEIGHT=153, START_W=58, GOAL_W=50;
var STEPS_GOAL=8000, WATER_GOAL=8;
var DR_PHONE='963991863344';
var TOTAL_LOSE=START_W-GOAL_W; // 8

// فطور خيارات
var BREAKFAST_OPTS=[
  {id:'b1',label:'خيار 1 — بيض',items:['بيضتان مسلوقتان','رغيف عربي أسمر صغير 60غ','خيار وبندورة وخس']},
  {id:'b2',label:'خيار 2 — شوفان',items:['4 ملاعق شوفان مطبوخ بالماء','ملعقة صغيرة قرفة','تفاحة صغيرة']},
  {id:'b3',label:'خيار 3 — جبنة',items:['سندويش جبنة خالية اللاكتوز أو بديل نباتي','خضار طازجة']},
  {id:'b4',label:'خيار 4 — فول',items:['فول مسلوق 3/4 كوب مع ليمون ومعلقتين لبن','سلطة خضراء','نصف رغيف أسمر']}
];

// عشاء خيارات
var DINNER_OPTS=[
  {id:'d1',label:'خيار 1 — بيض',items:['بيضتان قلي أو سلق','سلطة']},
  {id:'d2',label:'خيار 2 — تونة',items:['علبة تونة + جزرة','شريحة خبز أسمر']},
  {id:'d3',label:'خيار 3 — حمص',items:['حمص مسلوق أو حمص بطحينة خفيف','خضار']},
  {id:'d4',label:'خيار 4 — دجاج',items:['صدر دجاج مشوي مع شوربة خضار أو عدس','سلطة']}
];

// سناك صباح خيارات
var SNACK1_OPTS=['تفاحة 🍎','6 حبات فريز 🍓','خوخة 🍑','برتقالة صغيرة 🍊','10 حبات جوز 🌰'];

// سناك عصر خيارات
var SNACK2_OPTS=['بوشار منزلي 3 أكواب 🍿','تفاحة مع ملعقة زبدة فستق 🍎','15غ شوكولا داكنة 🍫','كوب زهورات 🌸','خيار وجزر 🥕'];

// حلويات
var SWEETS=[
  {name:'مهلبية بالشوفان',items:['حليب لوز أو شوفان غير محلى','شوفان مطحون مطبوخ مع قرفة وقطعة شوكولا دارك']},
  {name:'موزة صغيرة مع قرفة',items:['موزة صغيرة','رشة قرفة']},
];

// غداء الأيام
var LUNCHES=[
  {day:'اليوم 1',items:['ملوخية مع دجاج','نصف كوب رز','سلطة']},
  {day:'اليوم 2',items:['كوسا محشي 4 حبات متوسطة','سلطة لبن بالخيار إن أمكن']},
  {day:'اليوم 3',items:['شيش طاووق منزلي','بطاطا مشوية صغيرة','سلطة']},
  {day:'اليوم 4',items:['يبرق 10-12 قطعة متوسطة','سلطة فتوش']},
  {day:'اليوم 5',items:['فاصولياء خضراء باللحم','نصف كوب رز']},
  {day:'اليوم 6',items:['جاج مشوي','سلطة','خبز أسمر']},
  {day:'اليوم 7',items:['لحمة بالصينية مع الخضار','سلطة كبيرة']}
];

var EXERCISES=[
  {id:'walk',name:'المشي 30 دقيقة',dur:'30 دق يومياً',emoji:'🚶',desc:'أو 8,000 خطوة على الأقل'},
  {id:'squat',name:'سكوات',dur:'3 × 15',emoji:'🏋',desc:'ظهر مستقيم، انزلي ببطء'},
  {id:'stairs',name:'صعود الدرج',dur:'3 × 15',emoji:'🪜',desc:'3 مرات أسبوعياً — رائع للأرجل والقلب'},
  {id:'lunge',name:'لانج',dur:'3 × 15',emoji:'🦵',desc:'12 تكراراً لكل رجل'},
  {id:'elastic',name:'تمارين مطاطية بسيطة',dur:'3 × 15',emoji:'🤸',desc:'تمدد وتقوية بالمطاط'}
];

var MOTIVATIONS=[
  {emoji:'🌸',text:'حنان، 8 كيلو هو هدف قريب جداً! بالمعدل الصحي ممكن تحقيقيه في 3-4 أشهر. أنتِ قادرة!'},
  {emoji:'🔥',text:'مقاومة الإنسولين تتحسن مع كل وجبة صحية. كل خيار صح تاخديه هو علاج!'},
  {emoji:'💪',text:'22 سنة = أيض ممتاز وجسم يستجيب سريع. الآن أفضل وقت تبدئي فيه!'},
  {emoji:'🚶',text:'30 دقيقة مشي يومياً تحسن حساسية الإنسولين حتى 40%! أقوى دواء وأبسطه.'},
  {emoji:'✨',text:'الحلويات المسموحة في برنامجك مش غش — هي جزء من العلاج. استمتعي بها بثقة!'},
  {emoji:'💧',text:'8 أكواب ماء يومياً تحسن التمثيل الغذائي وتخفف أعراض مقاومة الإنسولين.'},
  {emoji:'🌙',text:'النوم الجيد يرتب هرمون الإنسولين. نامي 7-8 ساعات — هو جزء من العلاج!'},
  {emoji:'🎯',text:'الثبات على البرنامج أهم من الكمال. يوم "ناقص" أفضل ألف مرة من يوم تتوقفين فيه!'},
  {emoji:'🍃',text:'كل وجبة تختارينها بعناية هي خطوة نحو صحة أفضل وطاقة أعلى طوال اليوم!'},
  {emoji:'💕',text:'أحبي نفسك بما يكفي لتعتني بجسمك — هذا ليس تضحية، هذا حب حقيقي!'}
];

var CHALLENGES=[
  {id:'water',label:'💧 شربتِ 8 أكواب ماء'},
  {id:'walk',label:'🚶 مشيتِ 30 دقيقة أو 8,000 خطوة'},
  {id:'nobfast',label:'🌅 ما تخطيتِ الفطور'},
  {id:'protein',label:'🥩 بروتين في كل وجبة'},
  {id:'nosugary',label:'🚫 تجنبتِ السكريات المضافة'},
  {id:'sleep',label:'🌙 نمتِ 7-8 ساعات'},
  {id:'drplan',label:'📋 التزمتِ بالخطة كاملاً'}
];

var tab='home', selDay=0, motIdx=0;
function todayKey(){return new Date().toISOString().slice(0,10);}
function loadD(){try{return JSON.parse(localStorage.getItem('hanan_v1')||'{}');}catch(e){return{};}}
function saveD(){try{localStorage.setItem('hanan_v1',JSON.stringify(D));}catch(e){}}
var D=loadD();
function td(){if(!D[todayKey()])D[todayKey()]={};return D[todayKey()];}
function upd(k,v){var t=td();t[k]=v;saveD();render();}
function updM(obj){var t=td();for(var k in obj)t[k]=obj[k];saveD();render();}

function go(t){
  tab=t;
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.toggle('active',b.dataset.tab===t);});
  var c=document.getElementById('content');c.style.opacity='0';
  setTimeout(function(){render();c.style.opacity='1';},120);
}
function render(){
  var c=document.getElementById('content');
  if(tab==='home')c.innerHTML=renderHome();
  else if(tab==='plan')c.innerHTML=renderPlan();
  else if(tab==='exercise')c.innerHTML=renderExercise();
  else if(tab==='macros')c.innerHTML=renderMacros();
  else c.innerHTML=renderMotiv();
}
function getCurWeight(){var ws=D._weights||[];return ws.length?ws[ws.length-1].weight:START_W;}
function getStreak(){
  var s=0,d=new Date();
  for(var i=0;i<30;i++){
    var k=d.toISOString().slice(0,10);
    if(D[k]&&(D[k].steps>=STEPS_GOAL||D[k]['meal_lunch'])){s++;d.setDate(d.getDate()-1);}else break;
  }return s;
}

// ─── HOME ───
function renderHome(){
  var t=td();
  var steps=t.steps||0,water=t.water||0;
  var stepsPct=Math.min(100,Math.round(steps/STEPS_GOAL*100));
  var r=48,circ=2*Math.PI*r,off=circ-(stepsPct/100)*circ;
  var streak=getStreak();
  var doneCh=CHALLENGES.filter(function(c){return t[c.id];}).length;
  var mot=MOTIVATIONS[motIdx%MOTIVATIONS.length];
  var cw=getCurWeight();
  var lost=Math.max(0,+(START_W-cw).toFixed(1));
  var toGo=Math.max(0,+(cw-GOAL_W).toFixed(1));
  var pct=Math.min(100,Math.round(lost/TOTAL_LOSE*100));

  var glasses='';
  for(var i=0;i<WATER_GOAL;i++){
    glasses+='<button class="water-cup '+(i<water?'filled':'')+'" onclick="setWater('+(i<water?i:i+1)+')">💧</button>';
  }
  var chHtml='';
  for(var ci=0;ci<CHALLENGES.length;ci++){
    var ch=CHALLENGES[ci];var cd=!!t[ch.id];
    chHtml+='<div class="ch-item '+(cd?'done-ch':'')+'" onclick="toggleCh(\''+ch.id+'\')"><div class="ch-circle '+(cd?'done':'')+'">'+(cd?'✓':'')+' </div><span style="font-size:13px;color:'+(cd?'#dcfce7':'var(--sub)')+';">'+ch.label+'</span>'+(cd?'<span style="margin-right:auto;font-size:11px;color:#86efac;">تم ✓</span>':'')+' </div>';
  }

  return '<div class="fade-in">'
    +'<div class="hero">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;">'
        +'<div>'
          +'<div style="font-size:10px;color:var(--pink2);font-weight:600;margin-bottom:2px;">برنامج مقاومة الإنسولين 🌸</div>'
          +'<div class="hero-name">'+NAME+'</div>'
          +'<div style="font-size:11px;color:var(--sub);margin-top:2px;">هدف: 50 كغ | 153 سم | 22 سنة</div>'
          +'<div style="margin-top:8px;">'
            +'<span class="stat-pill">⚖ '+cw+' كغ</span>'
            +'<span class="stat-pill">🎯 '+toGo+' كغ باقي</span>'
          +'</div>'
        +'</div>'
        +'<div class="steps-ring" style="cursor:pointer;" onclick="openModal(\'stepsModal\')">'
          +'<svg width="110" height="110"><circle cx="55" cy="55" r="'+r+'" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="8"/><circle cx="55" cy="55" r="'+r+'" fill="none" stroke="url(#pg)" stroke-width="8" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'" stroke-linecap="round" style="transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1s;"/><defs><linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#be185d"/><stop offset="100%" stop-color="#f9a8d4"/></linearGradient></defs></svg>'
          +'<div class="steps-center"><div class="steps-num">'+(steps>=1000?(steps/1000).toFixed(1)+'k':steps)+'</div><div style="font-size:9px;color:var(--muted);">خطوة 👟</div><div style="font-size:8px;color:var(--muted);">اضغطي</div></div>'
        +'</div>'
      +'</div>'
      +'<div style="margin-top:11px;position:relative;z-index:1;">'
        +'<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:4px;"><span>'+START_W+' كغ</span><span style="color:var(--pink2);font-weight:700;">'+pct+'% من الهدف 🎯</span><span>'+GOAL_W+' كغ</span></div>'
        +'<div style="height:7px;background:rgba(255,255,255,0.06);border-radius:10px;overflow:hidden;"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,#be185d,#f9a8d4);border-radius:10px;transition:width 0.8s;"></div></div>'
        +'<div style="display:flex;gap:7px;margin-top:8px;">'
          +'<div style="flex:1;background:rgba(255,255,255,0.04);border-radius:9px;padding:7px;text-align:center;"><div style="font-size:14px;font-weight:800;color:#fbbf24;">'+lost+'</div><div style="font-size:9px;color:var(--muted);">خسرتِ كغ</div></div>'
          +'<div style="flex:1;background:rgba(255,255,255,0.04);border-radius:9px;padding:7px;text-align:center;"><div style="font-size:14px;font-weight:800;color:var(--pink2);">'+toGo+'</div><div style="font-size:9px;color:var(--muted);">الهدف الباقي</div></div>'
          +'<div style="flex:1;background:rgba(255,255,255,0.04);border-radius:9px;padding:7px;text-align:center;"><div style="font-size:14px;font-weight:800;color:#86efac;">'+streak+'</div><div style="font-size:9px;color:var(--muted);">يوم متتالي</div></div>'
        +'</div>'
      +'</div>'
    +'</div>'

    +'<div class="mot-card">'
      +'<div style="font-size:32px;margin-bottom:7px;">'+mot.emoji+'</div>'
      +'<div style="font-size:14px;font-weight:600;color:var(--text);line-height:1.6;">'+mot.text+'</div>'
      +'<button onclick="nextMot()" style="margin-top:9px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:var(--sub);border-radius:20px;padding:5px 14px;font-size:11px;cursor:pointer;font-family:\'IBM Plex Sans Arabic\',sans-serif;">تشجيعة جديدة ✨</button>'
    +'</div>'

    +'<div class="grid3" style="margin-bottom:11px;">'
      +'<div class="card" style="padding:11px;margin-bottom:0;text-align:center;"><div style="font-size:20px;">✅</div><div style="font-family:\'Syne\',sans-serif;font-size:22px;font-weight:800;color:var(--pink);">'+doneCh+'/7</div><div style="font-size:9px;color:var(--muted);">تحديات</div></div>'
      +'<div class="card" style="padding:11px;margin-bottom:0;text-align:center;"><div style="font-size:20px;">👟</div><div style="font-family:\'Syne\',sans-serif;font-size:22px;font-weight:800;color:var(--peach);">'+stepsPct+'%</div><div style="font-size:9px;color:var(--muted);">الخطوات</div></div>'
      +'<div class="card" style="padding:11px;margin-bottom:0;text-align:center;"><div style="font-size:20px;">💧</div><div style="font-family:\'Syne\',sans-serif;font-size:22px;font-weight:800;color:#93c5fd;">'+water+'/8</div><div style="font-size:9px;color:var(--muted);">ماء</div></div>'
    +'</div>'

    +'<div class="card" style="border-color:rgba(147,197,253,0.28);background:rgba(59,130,246,0.06);margin-bottom:11px;">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;"><div style="font-size:13px;font-weight:700;color:#93c5fd;">💧 الماء اليومي</div><span style="font-size:11px;font-weight:700;color:#93c5fd;">'+water+'/8 أكواب</span></div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;">'+glasses+'</div>'
      +'<div style="text-align:center;margin-top:7px;font-size:10px;color:var(--muted);">كل كوب = 250مل | الهدف 2 لتر 💙</div>'
    +'</div>'

    +'<div class="section-title">🎯 تحديات اليوم</div>'
    +'<div style="margin-bottom:13px;">'+chHtml+'</div>'

    +'<button class="btn-pink" onclick="openModal(\'stepsModal\')">👟 سجّلي خطواتك اليوم</button>'
    +'<button class="btn-pink" style="background:linear-gradient(135deg,#5b21b6,#7c3aed);" onclick="openModal(\'weightModal\')">⚖️ سجّلي وزنك</button>'
    +'<button class="btn-ghost" onclick="shareReport()">📤 شاركي تقريرك مع الدكتورة</button>'
  +'</div>';
}

// ─── PLAN ───
function renderPlan(){
  var t=td();
  var selB=t.selBreakfast||'b1';
  var selD=t.selDinner||'d1';
  var selS1=t.selSnack1||SNACK1_OPTS[0];
  var selS2=t.selSnack2||SNACK2_OPTS[0];
  var lunch=LUNCHES[selDay];

  // breakfast buttons
  var bBtns=BREAKFAST_OPTS.map(function(b){
    return '<button class="choice-btn '+(selB===b.id?'chosen':'')+'" onclick="chooseB(\''+b.id+'\')">'+b.label+'</button>';
  }).join('');
  var bItems=BREAKFAST_OPTS.filter(function(b){return b.id===selB;})[0];
  var bHtml=bItems?bItems.items.map(function(i){return '<div class="meal-item"><div class="meal-dot"></div><span>'+i+'</span></div>';}).join(''):'';

  // snack1 buttons
  var s1Btns=SNACK1_OPTS.map(function(s,i){
    return '<button class="choice-btn '+(selS1===s?'chosen':'')+'" onclick="chooseS1('+i+')">'+s+'</button>';
  }).join('');

  // snack2 buttons
  var s2Btns=SNACK2_OPTS.map(function(s,i){
    return '<button class="choice-btn '+(selS2===s?'chosen':'')+'" onclick="chooseS2('+i+')">'+s+'</button>';
  }).join('');

  // dinner buttons
  var dBtns=DINNER_OPTS.map(function(d){
    return '<button class="choice-btn '+(selD===d.id?'chosen':'')+'" onclick="chooseD(\''+d.id+'\')">'+d.label+'</button>';

  var lDone=!!t['meal_lunch'];
  var bDone=!!t['meal_breakfast'];
  var dDone=!!t['meal_dinner'];

  // sweets
  var sweetsHtml=SWEETS.map(function(s){return '<div style="margin-bottom:9px;"><div style="font-size:12px;font-weight:700;color:var(--peach2);margin-bottom:5px;">🍮 '+s.name+'</div>'+s.items.map(function(i){return '<div class="meal-item"><div class="meal-dot" style="background:var(--peach);"></div><span>'+i+'</span></div>';}).join('')+'</div>';}).join('');

  return '<div class="fade-in">'
    +'<div class="section-title">🍽 خطتك الغذائية</div>'

    +'<div class="card card-peach" style="margin-bottom:11px;">'
      +'<span class="meal-tag breakfast">الفطور 🌅</span>'
      +'<div style="font-size:11px;color:var(--muted);margin-bottom:8px;">اختاري خياراً:</div>'
      +'<div class="choice-row">'+bBtns+'</div>'
      +bHtml
      +'<button class="done-meal-btn '+(bDone?'on':'off')+'" onclick="toggleMeal(\'breakfast\')">'+(bDone?'✅ فطور مسجّل! 🌸':'⭕ سجّلي فطورك')+'</button>'
    +'</div>'

    +'<div class="card card-violet" style="margin-bottom:11px;">'
      +'<span class="meal-tag snack">سناك الصباح 🍬</span>'
      +'<div style="font-size:11px;color:var(--muted);margin-bottom:8px;">اختاري واحداً:</div>'
      +'<div class="choice-row">'+s1Btns+'</div>'
      +'<div style="font-size:13px;color:var(--sub);padding:5px 0;">'+selS1+'</div>'
      +'<button class="done-meal-btn '+(!!t['meal_snack1']?'on':'off')+'" onclick="toggleMeal(\'snack1\')">'+(!!t['meal_snack1']?'✅ تم! 🌸':'⭕ سجّلي السناك')+'</button>'
    +'</div>'

    +'<div class="card card-pink" style="margin-bottom:11px;">'
      +'<span class="meal-tag lunch">الغداء ☀</span>'
      +'<div class="day-tabs" style="margin-bottom:9px;">'+lTabs+'</div>'
      +'<div style="background:rgba(236,72,153,0.07);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:12px;font-weight:700;color:var(--pink2);">'+lunch.day+'</div>'
      +lunch.items.map(function(i){return '<div class="meal-item"><div class="meal-dot"></div><span>'+i+'</span></div>';}).join('')
      +'<button class="done-meal-btn '+(lDone?'on':'off')+'" onclick="toggleMeal(\'lunch\')">'+(lDone?'✅ غداء مسجّل! 🌸':'⭕ سجّلي غداءك')+'</button>'
    +'</div>'

    +'<div class="card card-violet" style="margin-bottom:11px;">'
      +'<span class="meal-tag snack">سناك العصر 🌤</span>'
      +'<div style="font-size:11px;color:var(--muted);margin-bottom:8px;">اختاري واحداً:</div>'
      +'<div class="choice-row">'+s2Btns+'</div>'
      +'<div style="font-size:13px;color:var(--sub);padding:5px 0;">'+selS2+'</div>'
      +'<button class="done-meal-btn '+(!!t['meal_snack2']?'on':'off')+'" onclick="toggleMeal(\'snack2\')">'+(!!t['meal_snack2']?'✅ تم! 🌸':'⭕ سجّلي السناك')+'</button>'
    +'</div>'

    +'<div class="card card-sage" style="margin-bottom:11px;">'
      +'<span class="meal-tag dinner">العشاء 🌙</span>'
      +'<div style="font-size:11px;color:var(--muted);margin-bottom:8px;">اختاري خياراً:</div>'
      +'<div class="choice-row">'+dBtns+'</div>'
      +dHtml
      +'<button class="done-meal-btn '+(dDone?'on':'off')+'" onclick="toggleMeal(\'dinner\')">'+(dDone?'✅ عشاء مسجّل! 🌸':'⭕ سجّلي عشاءك')+'</button>'
    +'</div>'

    +'<div class="card card-peach" style="margin-bottom:11px;">'
      +'<span class="meal-tag sweet">حلويات مناسبة للإنسولين 🍮</span>'
      +'<div style="font-size:11px;color:var(--muted);margin-bottom:10px;">2-3 مرات أسبوعياً فقط</div>'
      +sweetsHtml
    +'</div>'

    +'<button class="btn-pink" onclick="shareDay()">📤 شاركي يومك مع الدكتورة</button>'
  +'</div>';
}

    {emoji:'💧',title:'الماء قبل الأكل',text:'كوب ماء 20 دقيقة قبل الوجبة = تأكلين أقل وجهازك الهضمي يعمل أفضل.'},
    {emoji:'🍂',title:'القرفة علاج طبيعي',text:'ربع ملعقة قرفة يومياً تحسن حساسية الإنسولين. أضيفيها للشوفان والقهوة والفاكهة!'},
    {emoji:'😴',title:'النوم هرموني',text:'قلة النوم ترفع الكورتيزول والإنسولين. 7-8 ساعات = أهم دواء مجاني!'},
    {emoji:'🥗',title:'الخضار أولاً',text:'ابدئي كل وجبة بالسلطة — الألياف تبطئ امتصاص السكر وتحمي من ارتفاع الإنسولين.'},
    {emoji:'💪',title:'العضلات حارقة',text:'كل كيلو عضلة تحرق 50 سعرة يومياً حتى وأنتِ جالسة. تمارين المقاومة أهم من الكارديو!'}
  ];
  return '<div class="fade-in">'
    +'<div class="section-title">🌟 حافزتك اليومية</div>'
    +'<div style="margin-bottom:13px;">'
    +MOTIVATIONS.map(function(m,i){return '<div class="mot-card" style="margin-bottom:9px;'+(i!==motIdx?'opacity:0.4;':'')+'"><div style="font-size:32px;margin-bottom:7px;">'+m.emoji+'</div><div style="font-size:13px;font-weight:600;color:var(--text);line-height:1.65;">'+m.text+'</div></div>';}).join('')
    +'</div>'
    +'<div class="section-title">💡 نصائح لمقاومة الإنسولين</div>'
    +tips.map(function(t){return '<div class="card" style="margin-bottom:8px;"><div style="display:flex;align-items:center;gap:9px;"><div style="font-size:26px;">'+t.emoji+'</div><div><div style="font-size:13px;font-weight:700;color:var(--text);">'+t.title+'</div><div style="font-size:12px;color:var(--sub);margin-top:2px;line-height:1.55;">'+t.text+'</div></div></div></div>';}).join('')
    +'<div class="card card-peach" style="margin-top:4px;">'
      +'<div style="font-size:12px;font-weight:700;color:var(--peach);margin-bottom:8px;">⭐ أهداف هالأسبوع</div>'
      +['ما تتخطي الفطور أي يوم','امشي 30 دقيقة أو 8,000 خطوة يومياً','مارسي تمارين المقاومة 3 مرات','أضيفي القرفة لوجبة واحدة يومياً','شاركي الدكتورة تقريرك كل يوم'].map(function(x){return '<div style="display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:12px;color:var(--sub);">✅ '+x+'</div>';}).join('')
    +'</div>'
  +'</div>';
}

// ─── ACTIONS ───
function toggleCh(id){var t=td();upd(id,!t[id]);if(!t[id])showToast('✅ تم! 🌸');}
function toggleMeal(key){var t=td();var mk='meal_'+key;upd(mk,!t[mk]);if(!t[mk])showToast('🍽 وجبة مسجّلة 💚');}
function toggleEx(id){var t=td();var arr=t.exDone||[];var next=arr.indexOf(id)>-1?arr.filter(function(x){return x!==id;}):[].concat(arr,[id]);upd('exDone',next);if(arr.indexOf(id)<0)showToast('💪 تمرين مكتمل! 🔥');}
function setWater(v){upd('water',v);if(v>=WATER_GOAL)showToast('💧 8 أكواب! 🎉');}
function nextMot(){motIdx=(motIdx+1)%MOTIVATIONS.length;render();}
function selectDay(i){selDay=i;if(tab==='plan')render();}
function chooseB(id){upd('selBreakfast',id);}
function chooseD(id){upd('selDinner',id);}
function chooseS1(i){upd('selSnack1',SNACK1_OPTS[i]||SNACK1_OPTS[0]);}
function chooseS2(i){upd('selSnack2',SNACK2_OPTS[i]||SNACK2_OPTS[0]);}
function openModal(id){document.getElementById(id).classList.remove('hidden');}
function closeModal(id){document.getElementById(id).classList.add('hidden');}
function saveSteps(){var v=parseInt(document.getElementById('stepsInput').value);if(v>0&&v<=50000){upd('steps',v);if(v>=STEPS_GOAL)showToast('🎉 8,000 خطوة! 🌸');else showToast('👟 '+v+' خطوة!');}closeModal('stepsModal');}
function saveWeight(){var w=parseFloat(document.getElementById('weightInput').value);if(w>0&&w<300){var ws=D._weights||[];D._weights=[].concat(ws,[{date:todayKey(),weight:w}]).slice(-30);saveD();showToast('⚖️ وزن مسجّل: '+w+' كغ');}closeModal('weightModal');render();}

function buildReport(){
  var t=td();
  var steps=t.steps||0,water=t.water||0;
  var exDone=t.exDone||[];
  var meals=['breakfast','snack1','lunch','snack2','dinner'];
  var mNames={breakfast:'الفطور',snack1:'سناك صباح',lunch:'الغداء',snack2:'سناك عصر',dinner:'العشاء'};
  var date=new Date().toLocaleDateString('ar-SA',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  var cw=getCurWeight();
  var mLines=meals.map(function(m){return '  '+(t['meal_'+m]?'✅':'❌')+' '+mNames[m];}).join('\n');
  var eLines=exDone.length?exDone.map(function(id){var ex=null;for(var i=0;i<EXERCISES.length;i++)if(EXERCISES[i].id===id){ex=EXERCISES[i];break;}return '  ✅ '+(ex?ex.name:id);}).join('\n'):'  ❌ لم تُسجَّل';
  var chDone=CHALLENGES.filter(function(c){return t[c.id];}).length;
  var chLines=CHALLENGES.map(function(c){return '  '+(t[c.id]?'✅':'❌')+' '+c.label;}).join('\n');
  return '🌸 تقرير حنان اليومي\n📅 '+date+'\n'+'─'.repeat(26)+'\n\n'
    +'⚖️ الوزن: '+cw+' كغ\n💧 الماء: '+water+'/8 أكواب\n👟 الخطوات: '+steps+'/8,000\n\n'
    +'🍽 الوجبات:\n'+mLines+'\n\n'
    +'💪 الرياضة:\n'+eLines+'\n\n'
    +'✅ التحديات ('+chDone+'/7):\n'+chLines+'\n\n'
    +'─'.repeat(26)+'\n👩‍⚕️ د. ميرنا | +963 991 863 344';
}
function shareReport(){window.open('https://wa.me/'+DR_PHONE+'?text='+encodeURIComponent(buildReport()),'_blank');}
function shareDay(){
  var t=td();var lunch=LUNCHES[selDay];
  var meals=['breakfast','snack1','lunch','snack2','dinner'];
  var mNames={breakfast:'الفطور',snack1:'سناك صباح',lunch:'الغداء',snack2:'سناك عصر',dinner:'العشاء'};
  var lines=meals.map(function(m){return (t['meal_'+m]?'✅':'❌')+' '+mNames[m];}).join('\n');
  var txt='🌸 وجبات حنان — '+lunch.day+'\n'+'─'.repeat(22)+'\n'+lines+'\n'+'─'.repeat(22)+'\n👩‍⚕️ د. ميرنا | +963 991 863 344';
  window.open('https://wa.me/'+DR_PHONE+'?text='+encodeURIComponent(txt),'_blank');
}
function showToast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},2500);}

setInterval(function(){if(tab==='home')render();},60000);
render();
</script>
